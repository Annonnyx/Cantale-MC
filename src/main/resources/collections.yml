# ============================================================
# Cantale — Collections (paliers nombreux, jamais reset)
# Copier dans plugins/CantalePlugin/
# ============================================================
# Récompenses par palier : cantox / key (RARE, EPIC, MYTHIC, LEGENDARY) /
# lives / spawner (true = RARE, ou rareté exacte : RARE, EPIC, MYTHIC).
# Spawners : RARE dès le milieu de tableau, EPIC/MYTHIC en haut.
# NOTE : les claims sont stockés par INDEX de palier — modifier les seuils
# ne permet pas de re-claim un index déjà pris (pas de double récompense).

# Paliers par défaut (cultures / minerais / mobs) — 12 paliers, dernier = années
default-tiers: [500, 1500, 4000, 10000, 25000, 60000, 150000, 400000, 1000000, 2500000, 7500000, 20000000]

# Récompenses par défaut (index 0 = palier 1)
default-rewards:
  - { cantox: 250 }
  - { cantox: 500 }
  - { cantox: 1000, key: RARE }
  - { cantox: 2000 }
  - { cantox: 4000, key: EPIC }
  - { cantox: 8000, spawner: RARE }
  - { cantox: 15000, key: MYTHIC }
  - { cantox: 30000, spawner: RARE }
  - { cantox: 50000, key: LEGENDARY }
  - { cantox: 80000, spawner: EPIC }
  - { cantox: 120000, lives: 1 }
  - { cantox: 200000, key: LEGENDARY, spawner: MYTHIC }

categories:
  crops:
    label: Cultures
    icon: WHEAT
    keys: [WHEAT, CARROT, POTATO, BEETROOT, NETHER_WART, SUGAR_CANE, MELON, PUMPKIN, COCOA, SWEET_BERRIES, GLOW_BERRIES, KELP, BAMBOO, CACTUS, CHORUS, BROWN_MUSHROOM, RED_MUSHROOM, CRIMSON_FUNGUS, WARPED_FUNGUS, TORCHFLOWER, PITCHER_CROP]
