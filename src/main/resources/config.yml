  verification:
    # Méthode: button | reaction | captcha
    method: "button"
    # Message de bienvenue envoyé après vérification
    welcome-message: "Bienvenue sur Cantale ! Tu es maintenant vérifié."
    # Supprimer le message de vérification après succès
    cleanup: true

  # ── Modération ──
  moderation:
    # ─ Anti-spam ─
    anti-spam: true
    spam-threshold: 5
    char-repeat-threshold: 15
    banned-words: []

    # ─ Anti-raid ─
    # Détecte un burst d'arrivées et bloque l'envoi de messages
    anti-raid: true
    # Nombre d'arrivées déclenchant le raid
    raid-join-threshold: 10
    # Fenêtre de détection (secondes)
    raid-join-window: 10
    # Activer le lockdown auto (bloque @everyone d'écrire)
    raid-lockdown: true
    # Durée du lockdown (secondes)
    raid-lockdown-duration: 300

    # ─ Anti-ping massif ─
    anti-ping: true
    # Nombre max de mentions par message
    max-mentions: 5
    # Mute auto quand le seuil est dépassé
    mute-on-ping: true
    # Durée du mute (secondes)
    mute-on-ping-duration: 3600

    # ─ Anti-caps ─
    anti-caps: true
    # Pourcentage de majuscules déclenchant la suppression
    caps-percent: 70

    # ─ Anti-liens / anti-invites ─
    anti-links: true
    # Liens autorisés (les autres sont supprimés)
    allowed-links:
      - "cantale.world"
      - "cantale.fun"
      - "cantale.store"
    # Supprimer automatiquement les liens d'invitation Discord
    anti-invites: true

    # ─ Escalade sanctions auto ─
    # Sanctions progressives : avertissement → timeout → kick → ban
    escalation: true
    # Seuil avant timeout (infractions 24h)
    warn-threshold: 3
    # Seuil avant timeout 1h
    mute-threshold: 2
    # Seuil avant kick
    kick-threshold: 2

    # ─ Cache messages (logs delete/edit) ─
    message-cache-size: 500

  # ── Chat Bridge ──
  chat-bridge:
    # Activer la sync MC ↔ Discord
    enabled: true
    # Format MC → Discord
    mc-to-discord-format: "**[%server%]** %player%: %message%"
    # Format Discord → MC
    discord-to-mc-format: "&9[Discord] &r%name%: %message%"
    # Ignorer les webhooks et bots
    ignore-bots: true

# ─── Items custom ──────────────────────────────────────────────
# Configuration des items custom (Cantale).
custom-items:
  # Adapter visuellement l'outil tenu en main (pioche/hache/pelle/cisailles)
  # selon le bloc visé. Sûr avec le Multi-Cantool 1x1 + instaBreak serveur.
  # Mettre false uniquement en cas de souci client.
  multi-cantool-visual-adapter: true

# ─── Resource Pack ─────────────────────────────────────────────
# URL publique du pack Cantale (zip). Les joueurs le reçoivent à la connexion.
# Généré avec : cd Cantale-ResourcePack && zip -r ../resourcepack.zip .
# SHA-1 : shasum -a 1 resourcepack.zip
resource-pack:
  url: "https://cantale.world/resourcepack.zip"
  sha1: "9a97010133ed7f49f2cb0e3e996874466796ea6c"

# ─── Système de Vote (Votifier) ────────────────────────────────
vote:
  # Diffuser un message au serveur quand un joueur vote
  broadcast: true

  # Sites de vote affichés via /vote
  # Format : "Nom Affiché|URL|cooldown"  →  cooldown en heures (1, 3, 24, ...)
  # La valeur du cooldown détermine le nombre de Cadeaux du Roi gagnés :
  #   24h → 3 caisses | 3h → 2 caisses | 1h → 1 caisse
  sites:
    - "Top-Serveurs.net|https://top-serveurs.net/minecraft/vote/cantale|3"
    - "Serveur-Prive.net|https://serveur-prive.net/minecraft/cantale/vote|1"
    - "ServeurListe.com|https://www.serveurliste.com/fr/minecraft/cantale/vote|1"

  # Tokens de vérification fournis par les sites de vote (optionnels).
  # Peuvent servir pour les callbacks/API ou la validation des votes entrants.
  tokens:
    serveurliste.com: "a2466aea-e3a1-4837-8146-eca287ff9422"
    serveur-prive.net: "TMOJRJMZ"

  # Anti-abuse : refuser un vote si la même IP a déjà voté sur ce site dans le délai (heures)
  ip-cooldown-hours: 1

  # Vote Party : récompense globale quand le serveur atteint X votes dans la journée
  vote-party:
    enabled: true
    # Nombre de votes dans la journée pour déclencher la Vote Party
    goal: 50
    # Récompense globale (commande exécutée par le serveur, %player% = un joueur en ligne aléatoire)
    reward-command: "give %player% cantale:crate_vote 1"
    # Message diffusé
    message: "&6&lVOTE PARTY ! &eLe serveur a atteint %goal% votes aujourd'hui ! Un Cadeau du Roi a été offert à %player% !"

  # Rappels de vote automatiques (en minutes)
  reminders:
    enabled: true
    interval-minutes: 30
    message: "&8[&6Vote&8] &7N'oublie pas de voter pour Cantale et gagner des récompenses ! &e/vote"

  # Paliers individuels (milestones) : bonus à vie quand un joueur atteint X votes
  milestones:
    enabled: true
    # tier: nombre total de votes → message + commande récompense
    tiers:
      10:
        message: "&6%player% &ea atteint &610 votes &e! Bravo !"
        reward-command: "give %player% cantale:crate_vote 2"
      50:
        message: "&6%player% &ea atteint &650 votes &e! Incroyable !"
        reward-command: "give %player% cantale:crate_rare 1"
      100:
        message: "&6%player% &ea atteint &6100 votes &e! Légendaire !"
        reward-command: "give %player% cantale:crate_epic 1"

  # Classement mensuel : réinitialisé automatiquement le 1er de chaque mois
  monthly-leaderboard:
    enabled: true
    # Nombre de gagnants récompensés
    top-reward-count: 3
    rewards:
      1:
        message: "&6&l%player% &6remporte le classement mensuel des votes !"
        reward-command: "give %player% cantale:crate_legendary 1"
      2:
        message: "&e%player% &7termine 2ème du classement mensuel des votes !"
        reward-command: "give %player% cantale:crate_mythic 1"
      3:
        message: "&e%player% &7termine 3ème du classement mensuel des votes !"
        reward-command: "give %player% cantale:crate_epic 1"


# ─── Anti-Cheat ─────────────────────────────────────────────────
anticheat:
  # Activer/désactiver l'anti-cheat globalement
  enabled: true
  
  # Permission pour bypass l'anti-cheat
  bypass-permission: "cantale.anticheat.bypass"
  
  # Permission pour recevoir les alertes
  alerts-permission: "cantale.anticheat.alerts"
  
  # ── Score de confiance ──
  trust:
    # Score de départ
    default: 100
    # Points récupérés par minute sans violation
    recovery-per-minute: 1
    # Seuil d'avertissement
    warn-threshold: 50
    # Seuil de kick
    kick-threshold: 25
    # Seuil de tempban
    ban-threshold: 10
    # Durée du tempban en minutes
    ban-duration-minutes: 30
    # Activer les punitions automatiques
    auto-punish: false
  
  # ── Alertes ──
  alerts:
    # Cooldown entre alertes identiques (secondes)
    cooldown-seconds: 5
    # Envoyer sur Discord
    discord-enabled: false
    # ID du salon Discord (laisser vide = salon mod-logs)
    discord-channel-id: ""
  
  # ── Checks de mouvement ──
  movement:
    speed:
      enabled: true
      # Vitesse max horizontale (blocs/tick) — vanilla sprint = ~0.28
      max-speed: 0.45
      # Violations consécutives avant alerte
      buffer: 3
      # Points de trust retirés par violation
      trust-penalty: 3
    fly:
      enabled: true
      # Ticks en l'air max sans support
      max-air-ticks: 40
      trust-penalty: 5
    nofall:
      enabled: true
      # Hauteur min de chute pour vérifier (blocs)
      min-fall-distance: 3.0
      trust-penalty: 4
    step:
      enabled: true
      # Hauteur max d'un step normal (blocs)
      max-step-height: 0.6
      trust-penalty: 3
    timer:
      enabled: true
      # Packets de mouvement max par seconde
      max-packets-per-second: 28
      trust-penalty: 4
  
  # ── Checks de combat ──
  combat:
    reach:
      enabled: true
      # Distance max d'attaque (blocs) — vanilla = 3.0
      max-reach: 3.5
      trust-penalty: 4
    killaura:
      enabled: true
      # Ticks min entre changements de cible
      min-target-switch-ticks: 3
      trust-penalty: 5
    autoclicker:
      enabled: true
      # CPS maximum autorisé
      max-cps: 20
      trust-penalty: 3
    aim:
      enabled: true
      # Ecart-type min des rotations (trop bas = aimbot)
      min-rotation-deviation: 1.5
      trust-penalty: 3
  
  # ── Checks de rotation ──
  rotation:
    enabled: true
    # Seuil de snap angle detection
    snap-angle-threshold: 5.0
    trust-penalty: 2
  
  # ── Checks d'inventaire ──
  inventory:
    autoarmor:
      enabled: false
      # Ticks min entre chaque équipement d'armure
      min-equip-ticks: 2
      trust-penalty: 2
    cheststealer:
      enabled: false
      # Ticks min entre chaque click dans un coffre
      min-click-ticks: 1
      trust-penalty: 2
    fastuse:
      enabled: false
      trust-penalty: 2
  
  # ── Checks de packets (nécessite ProtocolLib) ──
  packets:
    enabled: false


