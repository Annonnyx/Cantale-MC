  supabase:
    url: ""
    service-key: ""
    sync-interval: 0

  # ── Vérification ──
  verification:
    # Méthode: button | reaction | captcha
    method: "button"
    # Message de bienvenue envoyé après vérification
    welcome-message: "Bienvenue sur Cantale ! Tu es maintenant vérifié."
    # Supprimer le message de vérification après succès
    cleanup: true

  # ── Modération ──
  moderation:
    # ─ Anti-spam ─
    anti-spam: true
    spam-threshold: 5
    char-repeat-threshold: 15
    banned-words: []

    # ─ Anti-raid ─
    # Détecte un burst d'arrivées et bloque l'envoi de messages
    anti-raid: true
    # Nombre d'arrivées déclenchant le raid
    raid-join-threshold: 10
    # Fenêtre de détection (secondes)
    raid-join-window: 10
    # Activer le lockdown auto (bloque @everyone d'écrire)
    raid-lockdown: true
    # Durée du lockdown (secondes)
    raid-lockdown-duration: 300

    # ─ Anti-ping massif ─
    anti-ping: true
    # Nombre max de mentions par message
    max-mentions: 5
    # Mute auto quand le seuil est dépassé
    mute-on-ping: true
    # Durée du mute (secondes)
    mute-on-ping-duration: 3600

    # ─ Anti-caps ─
    anti-caps: true
    # Pourcentage de majuscules déclenchant la suppression
    caps-percent: 70

    # ─ Anti-liens / anti-invites ─
    anti-links: true
    # Liens autorisés (les autres sont supprimés)
    allowed-links:
      - "cantale.world"
      - "cantale.fun"
      - "cantale.store"
    # Supprimer automatiquement les liens d'invitation Discord
    anti-invites: true

    # ─ Escalade sanctions auto ─
    # Sanctions progressives : avertissement → timeout → kick → ban
    escalation: true
    # Seuil avant timeout (infractions 24h)
    warn-threshold: 3
    # Seuil avant timeout 1h
    mute-threshold: 2
    # Seuil avant kick
    kick-threshold: 2

    # ─ Cache messages (logs delete/edit) ─
    message-cache-size: 500

  # ── Chat Bridge ──
  chat-bridge:
    # Activer la sync MC ↔ Discord
    enabled: true
    # Format MC → Discord
    mc-to-discord-format: "**[%server%]** %player%: %message%"
    # Format Discord → MC
    discord-to-mc-format: "&9[Discord] &r%name%: %message%"
    # Ignorer les webhooks et bots
    ignore-bots: true

# ─── Resource Pack ─────────────────────────────────────────────
# URL publique du pack Cantale (zip). Les joueurs le reçoivent à la connexion.
# Généré avec : cd Cantale-ResourcePack && zip -r ../resourcepack.zip .
# SHA-1 : shasum -a 1 resourcepack.zip
resource-pack:
  url: "https://cantale.world/resourcepack.zip"
  sha1: "9a97010133ed7f49f2cb0e3e996874466796ea6c"

# ─── Système de Vote (Votifier) ────────────────────────────────
vote:
  # Diffuser un message au serveur quand un joueur vote
  broadcast: true
  # Sites de vote affichés via /vote
  # Format : "Nom Affiché|URL"  →  remplace les IDs par les tiens après inscription
  sites:
    - "Serveurs-Minecraft.fr|https://serveurs-minecraft.fr/serveur-Cantale.000000"
    - "Top-Serveurs.net|https://top-serveurs.net/minecraft/cantale"
    - "Serveur-Prive.net|https://serveur-prive.net/minecraft/cantale-000"
    - "List-Serveurs.com|https://list-serveurs.com/serveur/cantale"
