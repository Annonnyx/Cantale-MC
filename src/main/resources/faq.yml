  - id: pickantaxe
    triggers:
      - "pickantaxe"
      - "pickantaxes"
      - "pioche custom"
      - "pioche zone"
      - "pioche 3x3"
      - "pioche 5x5"
      - "pioche 7x7"
      - "pickantaxe netherite"
      - "comment avoir une pickantaxe"
      - "pickantaxe fer"
      - "pickantaxe diamant"
    response: |
      La Pickantaxe est une pioche custom avec une zone de minage (1x1, 3x3, 5x5 ou 7x7).
      Elle existe en Fer, Diamant et Netherite (Efficacité V en Fer, VII en Diamant, X en Netherite).
      Elle fonctionne avec un compteur d'utilisations : 1000 coups en Fer, 2000 en Diamant, 4000 en Netherite. 1 coup = 1 utilisation, peu importe la taille de la zone minée. La barre de durabilité reste toujours pleine : c'est le compteur affiché dans la description qui fait foi. À 0, l'outil se brise après son dernier coup.
      Enchantements fixes : enclume et meule bloquées, et elle n'est pas craftable.
      On l'obtient dans les caisses, giveaways et classements.

  - id: cantaxe
    triggers:
      - "cantaxe"
      - "cantaxes"
      - "hache custom"
      - "hache one shot"
      - "hache arbre"
      - "comment avoir une cantaxe"
      - "cantaxe netherite"
      - "cantaxe fer"
      - "cantaxe diamant"
    response: |
      La Cantaxe est une hache custom qui one-shot tous les arbres et mine comme une efficacité max.
      Elle existe en Fer, Diamant et Netherite (Efficacité V en Fer, VII en Diamant, X en Netherite).
      Elle fonctionne avec un compteur d'utilisations : 1000 coups en Fer, 2000 en Diamant, 4000 en Netherite. 1 arbre abattu = 1 utilisation, quel que soit le nombre de bûches. La barre de durabilité reste toujours pleine : c'est le compteur affiché dans la description qui fait foi. À 0, la hache se brise après son dernier coup.
      Enchantements fixes : enclume et meule bloquées, et elle n'est pas craftable.
      On l'obtient dans les caisses, giveaways et classements.

  - id: multi_cantool
