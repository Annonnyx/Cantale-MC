    response: |
      Cantale est en mode hardcore : tu as 3 vies au départ.
      Si tu perds ta dernière vie, ton stuff (inventaire + armure + offhand) est dropé au sol et ton inventaire est vidé avant le bannissement (IP). EC et PC ne sont pas touchés.
