      - "multi cantool"
      - "cantool"
      - "outil multifonction"
      - "outil custom"
      - "comment avoir un multi cantool"
      - "multi cantool netherite"
    response: |
      Le Multi-Cantool est un outil multifonction 1x1 qui s'adapte au bloc : il fait office de pioche, hache, pelle et cisailles.
      Disponible en Fer, Diamant et Netherite (Efficacité V en Fer, VII en Diamant, X en Netherite).
      Il fonctionne avec un compteur d'utilisations : 1000 coups en Fer, 2000 en Diamant, 4000 en Netherite (1 bloc cassé = 1 utilisation). La barre de durabilité reste toujours pleine : c'est le compteur affiché dans la description qui fait foi. À 0, l'outil se brise après son dernier coup.
      On l'obtient dans les caisses, giveaways et classements.

