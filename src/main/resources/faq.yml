  - id: spawners
    triggers:
      - "spawner"
      - "spawners"
      - "comment avoir un spawner"
      - "farm spawner"
      - "spawner cochon"
      - "spawner a cochon"
      - "ou trouver un spawner"
      - "silk touch spawner"
      - "touche de soie spawner"
      - "comment farm les mobs"
    response: |
      Les spawners Cantale viennent des caisses Rare (5 %), Épique (3 %) et Mythique/Légendaire (1,5 %) — pas des votes.
      Pose uniquement dans tes claims (interdit en PASDIC). Clic droit pour empiler jusqu'à x8 (même animal).
      Récupération : n'importe quelle pioche avec Touché de soie (bois ok) = 1 item du palier. Sans soie : rien.
      Vendables à l'/ah, pas au /shop. Hologramme au-dessus du bloc (Cochon ×3).
      Cadence linéaire : palier N = N mobs toutes les (8/N) s. T1 : 1/8 s ; T8 = 8 mobs / 1 s. Golem / ravageur / grand gardien / évocateurs / piglin brute : intervalle ×2.
      Rare : fermes (vache, cochon, mouton, poulet, lapin, champimeuh, poulpe, abeille) + hostiles communs (zombie, squelette, araignée, creeper, husk, noyé, vagabond, araignée venimeuse, envasé, poisson d'argent, zombie-villageois).
      Épique : enderman, blaze, sorcière, slime, gardien, ours, piglin, piglin zombifié, hoglin, phantom, wither squelette, pilleur, vindicateur, arpenteur, endermite, breeze, poulpe lumineux, chèvre, panda.
      Mythique : cube de magma, golem de fer, grand gardien, piglin brute, zoglin, ravageur, évocateurs.
      Pas de bosses, pas de ghast ni de shulker.
      Staff : /spawner give <joueur> <mob> [tier].

  - id: quetes
    triggers:
      - "quetes"
      - "quete"
      - "quest"
      - "quests"
      - "comment faire les quetes"
      - "comment marchent les quetes"
      - "quete journaliere"
      - "quete hebdo"
      - "quete saison"
      - "quete faction"
      - "quetes fac"
      - "course faction"
      - "comment gagner des quetes"
    response: |
      Quêtes solo : /quetes (alias /quests). Une quête à la fois par période (jour + semaine + saison en parallèle OK).
      Reset minuit Paris (jour), lundi 00h (hebdo), début de saison (saison).
      Les quêtes sont plus difficiles (objectifs quotidiens ×2,5). Types : récolte, minerais sans soie, cuisson, kills joueurs/mobs, distance depuis l'accept.
      La distance est comptée en marchant/volant : les téléportations ne comptent pas (TP, home, warp, spawn, rtp, /f spawn, /f warp).
      Récompenses : clef rare / épique / mythique. Terminer tout le pool donne une clef bonus (épique / mythique / ticket légendaire).
      Quêtes de faction : /quetes fac. Courses partagées — la première fac qui finit gagne le pouvoir (+1 / +7 / +200).
      Saison : /saison (durée 75 jours par défaut). Staff : /saison start.

  - id: collections
    triggers:
      - "collections"
      - "collection"
      - "paliers collection"
      - "comment marchent les collections"
      - "collection ble"
      - "collection minage"
    response: |
      /collections ouvre tes collections long terme (jamais reset).
      Catégories : cultures, minage (sans soie), mobs (y compris les stacks : chaque coup compte comme 1 kill), réactions chat, clefs ouvertes, votes, quêtes complétées, pic /bal, temps de jeu.
      Chaque sous-catégorie a des paliers exponentiels. Clique un palier atteint pour réclamer Cantox / clef / vie / spawner.
      Le pic d'argent est le plus haut /bal jamais atteint. Les kills de mobs s'alignent aussi sur tes stats Minecraft.

  - id: saison
    triggers:
      - "saison"
      - "nouvelle saison"
      - "quand finit la saison"
      - "duree saison"
      - "reset saison"
    response: |
      Une saison dure 75 jours (Europe/Paris) et se relance toute seule.
      /saison affiche le numéro et la date de fin.
      Les quêtes saisonnières sont tirées au début de saison. Les collections ne reset jamais.
      Staff : /saison start pour forcer une nouvelle saison.

  - id: faction_pasdic
    triggers:
      - "comment mettre un pasdic"
      - "pasdic comment"
      - "convertir claim pasdic"
      - "claim renforce"
      - "mode pasdic"
      - "protection pasdic"
      - "pasdic c est quoi"
    response: |
      PASDIC = claim renforce de ta faction. Seuls les membres peuvent y poser ou casser.
      Conversion : /f pasdic dans un claim de ta faction (Officier+), confirmation, puis paiement de 50 000 Cantox via la banque. Shift + clic gauche sur /f map declenche aussi la commande.
      Interdictions : coffres, trapped chest, barrel, ender chest, shulkers (conteneurs de stockage). Fours, hauts-fourneaux, fumoirs, hoppers, droppers, dispensers et spawners sont autorises.
      Les runes de fortification ne peuvent pas etre appliquees dans un PASDIC.

  - id: faction_raid
    triggers:
      - "comment lancer un raid"
      - "raid faction"
      - "f raid"
      - "comment raider"
      - "attaquer un claim"
      - "grief raid"
    response: |
      Pour raider un claim ennemi : declare d abord la guerre avec /f war <faction>, puis /f raid dans le claim ennemi (Officier+).
      Pendant le raid : casser, exploser, poser des blocs (TNT, cristaux, ancres, seaux, wither).
      Hors raid : aucune pose ou casse etrangere dans un claim ennemi.
      Duree, protection progressive et raids simultanes subis selon le pouvoir de la defenseur ; cooldown et raids simultanes menes selon le pouvoir de l attaquant.

  - id: faction_war
    triggers:
      - "comment declarer la guerre"
      - "f war"
      - "guerre faction"
      - "peace faction"
      - "alliance faction"
      - "f ally"
      - "f peace"
      - "declarer guerre"
    response: |
      Declarer la guerre : /f war <faction> (alias /f enemy). Met fin a une alliance existante.
      Faire la paix : /f peace <faction> (Officier+).
      S allier : /f ally <faction> (annule la guerre si elle existait).
      Toutes les commandes de diplomatie necessitent le grade Officier ou Chef.

  - id: faction_secret
    triggers:
      - "mode secret"
      - "f secret"
      - "secret faction"
      - "taxe secret"
      - "cacher faction"
      - "secret gratuit"
      - "avertissement banque secret"
    response: |
      /f secret active ou desactive le masquage de ta faction sur la carte.
      Cout : taxe journaliere de 1 000 Cantox par intervalle de 20 minutes, prelevee sur la banque de faction.
      3 jours gratuits pour les nouvelles factions et apres chaque raid subi.
      Les officiers recoivent un avertissement (en jeu + MP Discord si lie) si la banque ne couvre pas le prochain prelevement.

  - id: rune_fortification
    triggers:
      - "rune de fortification"
      - "comment obtenir une rune"
      - "runes fortification"
      - "protection rune"
      - "rune anti explosion"
    response: |
      La Rune de fortification immunise un chunk contre toutes les explosions (TNT, cristaux, wither, lits, ancres, etc.).
      Tres rare : obtenue uniquement en bonus des caisses Epique (4 %), Mythique (6,5 %) et Legendaire (6,5 %). Vote et Rare ne donnent pas de rune.
      Interdiction : ne peut pas etre appliquee dans un claim PASDIC.

