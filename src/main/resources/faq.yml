  - id: pickantaxe
    triggers:
      - "pickantaxe"
      - "pickantaxes"
      - "pioche custom"
      - "pioche zone"
      - "pioche 3x3"
      - "pioche 5x5"
      - "pioche 7x7"
      - "pickantaxe netherite"
      - "comment avoir une pickantaxe"
      - "pickantaxe fer"
      - "pickantaxe diamant"
    response: |
      La Pickantaxe est une pioche custom avec une zone de minage (1x1, 3x3, 5x5 ou 7x7).
      Elle existe en Fer, Diamant et Netherite. Plus le tier est haut, plus les enchantements sont forts (Efficiency/Unbreaking, jusqu'à 10 en Netherite avec durabilité infinie).
      Elle est enchantable avec Fortune, Silk Touch et Unbreaking, et n'est pas craftable.
      On l'obtient dans les caisses, giveaways et classements.

