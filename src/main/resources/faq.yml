      Salon compteur Discord (regles strictes) :
      - Envoie uniquement le nombre suivant (ex. 42), sans lettres ni texte.
      - Exactement precedent + 1 ; pas deux messages d affilee par la meme personne.
      - Message invalide : supprime + court avertissement.

