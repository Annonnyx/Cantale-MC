      Butin possible : Mending, Silk Touch et autres enchantements. Bonus extra : spawners Rare 5 %, Épique 3 %, Mythique 1,5 % ; Rune de Fortification Épique 4 %, Mythique 6,5 %, Légendaire 6,5 % (pas de rune en Vote/Rare).

