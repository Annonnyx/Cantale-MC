      - "je veux creer une team"
      - "j ai pas de faction"
      - "je n ai pas de faction"
      - "pas de faction"
      - "je suis pas dans une faction"
    response: |
      Pour créer une faction : /f create <nom>
      Il faut être au moins 8 joueurs pour fonder une faction.
      Pour rejoindre une faction existante : demande une invitation au chef (/f invite), puis tape /f accept.

