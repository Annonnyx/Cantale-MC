# ╔════════════════════════════════════════════════════════════╗
# ║          Cantale — Base de connaissances du bot FAQ        ║
# ╚════════════════════════════════════════════════════════════╝
#
# Ce fichier est rechargé à chaud avec /faq reload (permission cantale.admin).
# Le bot détecte les questions dans le chat Minecraft et sur Discord.
# Ne pas utiliser d'accents ni de ponctuation dans les triggers : le texte est
# normalisé (minuscule, sans accents, sans ponctuation) avant matching.

settings:
  # Score minimum (0-100) pour déclencher une réponse
  # Élevé volontairement : en cas de doute le bot se tait.
  confidence-threshold: 70
  # Cooldown par défaut entre deux réponses pour le même auteur (secondes)
  cooldown-seconds: 30
  # Si true, le bot ignore les messages sans "?" ni mot interrogatif
  require-question-marker: true
  # Si true, le bot ne répond que lorsque la question est EXPLICITE (?,
  # mot interrogatif en début de phrase, ou "est-ce que"). En cas de doute, silence.
  require-explicit-question: true
  # Minecraft : true = réponse publique dans le chat, false = message privé
  reply-in-public: false
  # Salons Discord où le bot écoute (IDs Discord). Si vide, il n'écoute que le salon support.
  discord-channels:
    - "1504903347738513448"
    - "1504901268957560952"
  # Fichier de log des questions non reconnues (dans le dossier du plugin)
  unmatched-log: "unmatched-questions.log"

entries:
  - id: faction_create
    triggers:
      - "comment creer une faction"
      - "creer une faction"
      - "comment faire une faction"
      - "faction comment creer"
      - "je veux une faction"
      - "faire une faction"
      - "nouvelle faction"
      - "comment on fait une faction"
      - "faut faire une faction"
      - "comment creer un clan"
      - "comment creer une team"
      - "je veux creer un clan"
      - "je veux creer une team"
      - "j ai pas de faction"
      - "je n ai pas de faction"
      - "pas de faction"
      - "je suis pas dans une faction"
    response: |
      Pour créer une faction : /f create <nom>
      Nom : 3–16 caractères (lettres, chiffres, _ et -).
      Effet : claim auto du chunk + spawn de faction à ta position (hors zone protégée / chunk déjà claim).
      Renommer (chef) : /f rename <nouveau_nom> (met aussi à jour le tag).
      Pour rejoindre une faction existante : demande une invitation (/f invite), puis /f accept.

  - id: faction_join
    triggers:
      - "comment rejoindre une faction"
      - "rejoindre une faction"
      - "invitation faction"
      - "accepter une faction"
      - "f accept"
      - "comment rentrer dans une faction"
      - "rejoindre une team"
      - "rejoindre un clan"
      - "accepter invitation faction"
      - "invitation team"
    response: |
      Pour rejoindre une faction, tu dois être invité par un membre autorisé.
      Le chef ou un officier fait /f invite <pseudo>, puis tu tapes /f accept.

  - id: faction_claim
    triggers:
      - "comment claim"
      - "claim un chunk"
      - "claimer"
      - "comment claimer une zone"
      - "territoire faction"
      - "comment claimer"
      - "claim chunk"
      - "zone faction"
      - "territoire"
    response: |
      Pour claim le chunk où tu te trouves : /f claim
      Pour unclaim : /f unclaim
      Carte interactive : /f map (inventaire — clic gauche gris = claim, clic droit sur ta fac = unclaim). /f map chat = ancienne grille ASCII.
      Quota claims : max(5, pouvoir / 10). Claims contigus obligatoires (touche N/S/E/O un claim existant, sauf le 1er du monde). Distance min 2 chunks avec les autres facs.
      Pouvoir : 60 + 5/membre à la création (65 seul), +5 join / -5 leave-kick, PvP ±5, events top, /f power (GUI ; 1 unité achetée → +10 pouvoir).
      Grief : il faut être en guerre avec la faction et lancer un raid avec /f raid (Officier+). Hors raid, les étrangers ne peuvent rien poser ni casser. PASDIC : aucun dégât.

  - id: grief_claim
    triggers:
      - "grief"
      - "comment grief"
      - "tnt claim"
      - "poser tnt"
      - "tnt ennemi"
      - "lodestone"
      - "cristal end claim"
      - "exploser un claim"
      - "casser un claim"
    response: |
      Pour grief/exploser un claim ennemi, il faut être en guerre ET lancer un raid avec /f raid (Officier+).
      Pendant le raid : casser, exploser, poser des blocs (TNT, cristaux, ancres, seaux, wither). Hors raid : les étrangers ne peuvent rien poser ni casser.
      Les têtes de wither s'achètent au /shop (Guerre) 50 000 Cantox, cap 6/j.
      Pas d'ouverture de coffres ennemis (sauf grade Chèvre). Zone PASDIC : aucun dégât, aucune pose.
      Le claim du f-spawn n'a plus d'immunité explosion : il se comporte comme un claim normal.

  - id: faction_spawn
    triggers:
      - "spawn faction"
      - "aller au spawn faction"
      - "f spawn"
      - "f go"
      - "comment aller au spawn de ma faction"
      - "spawn de ma faction"
      - "aller au f spawn"
      - "f go spawn"
    response: |
      Pour te téléporter au spawn de ta faction : /f spawn (ou /f go)
      Le chef peut le définir avec /f setspawn (dans un claim de la faction).
      Le claim du f-spawn n'est plus immunisé aux explosions : il se comporte comme un claim normal.
      Comme toute TP : 3 s immobile puis cooldown 30 s (sauf admin / mode trace).

  - id: faction_warp
    triggers:
      - "warp faction"
      - "f warp"
      - "comment faire un warp faction"
      - "teleportation faction"
      - "warp de faction"
      - "comment creer un warp faction"
      - "f setwarp"
    response: |
      Les warps de faction : /f warp [nom], /f setwarp <nom>, /f delwarp <nom> (dans un claim).
      Permission FWARP (Membre+). Quota : 1 si pouvoir < 60, sinon 1 + (pouvoir − 60) / 30.
      TP : 3 s immobile puis cooldown 30 s (sauf admin / mode trace).

