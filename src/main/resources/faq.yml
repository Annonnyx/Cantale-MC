      - "f home"
      - "comment faire un home faction"
      - "home de faction"
      - "home de ma faction"
      - "f sethome"
      - "comment creer un home faction"
    response: |
      Il n'y a plus de homes de faction.
      Homes perso : /home (set/delete selon ton grade).
      Pour la fac : /f spawn (ou /f go) et les warps /f warp.

  - id: faction_bank
    triggers:
      - "banque faction"
      - "f bank"
      - "argent faction"
      - "coffre faction"
      - "bank faction"
      - "coffre argent faction"
      - "argent commun faction"
    response: |
      Banque : /f bank (GUI) | /f bank add|take <montant> | /f power | /f bank power [n]
      /f bank → bouton Historique : dépôts, retraits, achats pouvoir (qui / montant / date).
      /f power (ou /f bank power) : GUI quotas, paliers, achat 1/2/3/5/max unités. Avec n : achat chat.
      Déposer : Recrue+. Retirer / acheter pouvoir : Officier ou chef.
      Achat : 1 unité → +10 pouvoir (n → +10×n). Prix : floor(5000 × 1,18^(unités_achetées × 10)), max 50 unités/achat.

