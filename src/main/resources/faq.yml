      - "cantaxe netherite"
      - "cantaxe fer"
      - "cantaxe diamant"
    response: |
      La Cantaxe est une hache custom qui one-shot tous les arbres et mine comme une efficacité max.
      Elle existe en Fer, Diamant et Netherite (efficacité 10 en Netherite).
      Elle est enchantable avec Silk Touch et Unbreaking, et n'est pas craftable.
      On l'obtient dans les caisses, giveaways et classements.

