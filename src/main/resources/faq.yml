      Les chances dependent du type de caisse : les caisses Epique, Mythique et Legendaire ont les meilleures tables de butin.

  - id: mc_crafting_table
    triggers:
      - "comment craft une table de craft"
      - "crafting table"
      - "table de craft"
      - "comment faire une table de craft"
      - "comment on craft une table de craft"
    response: |
      Pour crafter une table de craft : place 4 planches de bois (n importe quel type) dans les 4 cases de l inventaire de craft 2×2. Cela donne une Crafting Table.

  - id: mc_bed
    triggers:
      - "comment faire un lit"
      - "bed"
      - "lit minecraft"
      - "comment craft un lit"
      - "comment on fait un lit"
    response: |
      Pour crafter un lit : 3 laines de la meme couleur en haut + 3 planches de bois en bas dans une table de craft 3×3. Le lit permet de dormir la nuit et de definir un point de reapparition.

  - id: mc_furnace
    triggers:
      - "comment faire un four"
      - "furnace"
      - "four minecraft"
      - "comment craft un four"
    response: |
      Pour crafter un four : entoure la case centrale de 8 blocs de pierre lisse (cobblestone cuite) dans une table de craft 3×3. Il permet de cuire des minerais et de la nourriture.

  - id: mc_iron
    triggers:
      - "comment obtenir du fer"
      - "iron"
      - "minerai de fer"
      - "trouver du fer"
    response: |
      Le fer s obtient en minant du minerai de fer (fer brut) dans la pierre, surtout entre les couches 0 et 64 de l Overworld. Fais-le cuire dans un four pour obtenir des lingots de fer.

  - id: mc_pickaxe
    triggers:
      - "comment faire une pioche"
      - "pickaxe"
      - "pioche minecraft"
      - "comment craft une pioche"
    response: |
      Pour crafter une pioche : 3 matériaux (bois/pierre/fer/or/diamant) en haut + 2 batons au centre (cases 4 et 7) dans une table de craft 3×3. Le materiau determine la vitesse et la durabilite.

  - id: mc_nether_portal
    triggers:
      - "comment faire un portail du nether"
      - "nether portal"
      - "portail nether"
      - "aller dans le nether"
      - "comment craft un portail"
    response: |
      Pour faire un portail du Nether : construis un cadre de 4×5 blocs (minimum 4×5, coins optionnels) avec de l obsidienne, puis allume-le avec un briquet en fer et silex. Il relie l Overworld au Nether.

  - id: mc_diamonds
    triggers:
      - "comment trouver des diamants"
      - "diamonds"
      - "diamants minecraft"
      - "miner des diamants"
    response: |
      Les diamants se trouvent entre les couches -64 et 16 de l Overworld, surtout autour de la couche -59. Mine du diamant brut avec une pioche en fer ou mieux, puis fais-le fondre dans un four pour obtenir un diamant.

  - id: mc_ender_dragon
    triggers:
      - "comment tuer un dragon"
      - "ender dragon"
      - "dragon end"
      - "battre le dragon"
      - "comment battre le dragon"
    response: |
      Pour battre l Ender Dragon : detruis les cristaux sur les obsidiennes du sommet de l End, puis attaque le dragon avec un arc, une epee ou des lits/bed explosions. Attention aux shulkers sur le chemin des villes de l End.

  - id: mc_server
    triggers:
      - "comment faire un serveur"
      - "creer un serveur minecraft"
      - "serveur public"
      - "heberger un serveur"
    response: |
      Cantale n est pas un serveur public a recreer. Pour jouer, connecte-toi avec l IP Java : play.cantale.fun en Minecraft 1.21.11.
      Pour creer ton propre serveur, cherche des tutoriels en ligne ; ce n est pas le support Cantale.

  - id: mc_mods
    triggers:
      - "comment installer un mod"
      - "mods"
      - "mod minecraft"
      - "faut un mod"
      - "besoin d un mod"
    response: |
      Cantale est un serveur Paper 1.21.11 avec des plugins. Tu n as pas besoin de mod cote client pour jouer.
      Installe simplement Minecraft Java Edition 1.21.11 et connecte-toi avec play.cantale.fun. Les mods sont a tes risques et perils.
