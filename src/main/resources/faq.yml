    response: |
      Le Multi-Cantool est un outil multifonction qui s'adapte au bloc : il fait office de pioche, hache, pelle et cisailles.
      Il existe en mode 1x1 (un seul bloc) ou mode 3x3 / arbre entier.
      Disponible en Fer, Diamant et Netherite (efficacité 10 en Netherite).
      On l'obtient dans les caisses, giveaways et classements.

