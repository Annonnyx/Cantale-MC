name: CantalePlugin
version: 1.0.0
main: fr.cantale.plugin.CantalePlugin
api-version: 1.21
author: Cantale
description: Plugin Minecraft complet avec factions, économie, vies hardcore, et plus encore
softdepend:
  - Votifier
  - NuVotifier
  - packetevents
  - GrimAC

# Plugin message channels pour la désactivation des minimaps tierces non officielles
plugin-message-channels:
  - journeymap:common
  - xaerominimap:main
  - voxelmap:main

commands:
  cantale:
    description: Affiche les informations du serveur et les commandes utiles
    usage: /cantale
  admin:
    description: Liste toutes les commandes admin et modérateur
    usage: /admin [f rename <faction> <nouveau_nom>|…]
    permission: cantale.admin
  dropvie:
    description: Sacrifier une vie
    usage: /dropvie
  givevie:
    description: Donner une vie à un joueur (console = grant admin sans coût)
    usage: /givevie <joueur>
    permission: cantale.givevie
    permission-message: "§cPermission manquante (cantale.givevie). Depuis la console : givevie <joueur>"
  addlife:
    description: Ajouter des vies à un joueur (admin / console)
    usage: /addlife <joueur> <nombre>
    permission: cantale.admin
  removelife:
    description: Retirer des vies à un joueur (admin / console)
    usage: /removelife <joueur> <nombre>
    permission: cantale.admin
  f:
    description: Commandes de faction (menu /f, banque, pouvoir, claims…)
    usage: /f [rename|bank|power|claim|…]
    aliases: [faction]
  raid:
    description: Déclarer un raid sur la faction du claim ennemi actuel
    usage: /raid
  fc:
    description: Chat de faction
    usage: /fc [message]
  profile:
    description: Affiche le profil du joueur
    usage: /profile
  link:
    description: Génère un code pour lier son compte Discord
    usage: /link
  unlink:
    description: Délie son propre compte Discord
    usage: /unlink confirm
  forceunlink:
    description: Force la suppression de la liaison Discord d'un joueur (admin)
    usage: /forceunlink <joueur>
    permission: cantale.admin
  linkforce:
    description: Force la liaison Discord ↔ Minecraft (admin)
    usage: /linkforce <Pseudo MC> <ID Discord>
    permission: cantale.admin
  pay:
    description: Payer un joueur en Cantox
    usage: /pay <joueur> <montant>
  balance:
    description: Afficher son solde Cantox
    usage: /balance [joueur]
    aliases: [bal, money]
  ah:
    description: Hôtel des ventes
    usage: /ah <subcommand>
    aliases: [auction, hdv]
  trade:
    description: Échanger avec un joueur
    usage: /trade <joueur|accept|decline>
    aliases: [trades]
  customitem:
    description: Donner un item custom (admin / console)
    usage: /customitem <type> [joueur]
    permission: cantale.admin
  home:
    description: Gérer ses homes personnels (TP cooldown 30 s, warmup 3 s)
    usage: /home [set|delete|del] [nom]
  adminhome:
    description: "Staff — lister/TP/supprimer les homes d'un joueur"
    usage: "/adminhome check <joueur> | /adminhome tp <joueur> <nom> | /adminhome delete <joueur> <nom>"
    aliases: [ahome, seehome]
    permission: cantale.moderator
    permission-message: "§cPermission refusée (cantale.admin / cantale.moderator)."
  adminec:
    description: "Staff — ouvrir/éditer l'ender chest d'un joueur (live si en ligne)"
    usage: /adminec <joueur>
    aliases: [aec, seeec]
    permission: cantale.moderator
    permission-message: "§cPermission refusée (cantale.admin / cantale.moderator)."
  adminpc:
    description: "Staff — ouvrir/éditer les coffres privés (PC) d'un joueur"
    usage: /adminpc <joueur> [1|2|3]
    aliases: [apc, sepc]
    permission: cantale.moderator
    permission-message: "§cPermission refusée (cantale.admin / cantale.moderator)."
  admininv:
    description: "Staff — ouvrir/éditer l'inventaire d'un joueur en direct"
    usage: /admininv <joueur>
    aliases: [ainv, seeinv]
    permission: cantale.moderator
    permission-message: "§cPermission refusée (cantale.admin / cantale.moderator)."
  combattant:
    description: "Admin — basculer le mode combattant d'un joueur"
    usage: /combattant <joueur>
    aliases: [combatant]
    permission: cantale.admin
    permission-message: "§cPermission refusée (cantale.admin)."
  lock:
    description: "Staff — verrouiller/déverrouiller un joueur"
    usage: /lock <joueur>
    aliases: [freeze]
    permission: cantale.moderator
    permission-message: "§cPermission refusée (cantale.admin / cantale.moderator)."
  warp:
    description: Téléportation aux warps publics (cooldown 30 s, warmup 3 s)
    usage: /warp [nom|set|delete|toggle]
  fw:
    description: Warps de faction publics (TP tout le serveur ; create/delete officiers+ dans un claim)
    usage: /fw [nom|list|create <nom>|delete <nom>]
    aliases: [fwarp, fwarps]
  spawn:
    description: Téléportation au spawn (cooldown 30 s, warmup 3 s)
    usage: /spawn
  rtp:
    description: Téléportation aléatoire (cooldown 5 min + 30 s global, warmup 3 s)
    usage: /rtp
  tpa:
    description: Demander à se téléporter vers un joueur (cooldown 30 s, warmup 3 s)
    usage: /tpa <joueur>
  tpahere:
    description: Demander à un joueur de se téléporter vers toi (cooldown 30 s, warmup 3 s)
    usage: /tpahere <joueur>
  tpyes:
    description: Accepter une demande de téléportation
    usage: /tpyes
    aliases: [tpaccept]
  tpno:
    description: Refuser une demande de téléportation
    usage: /tpno
    aliases: [tpdeny]
  moderation:
    description: Outils de modération
    usage: /moderation <kick|mute|unmute|tp|tphere|vanish>
    permission: cantale.moderator
  vanish:
    description: Activer/désactiver le vanish
    usage: /vanish
    permission: cantale.moderator
  modhelp:
    description: Aide pour les commandes de modération
    usage: /modhelp
    permission: cantale.moderator
  wanted:
    description: Système de primes
    usage: /wanted [add|list]
    aliases: [prime, primes]
  pc:
    description: Coffre privé virtuel
    usage: /pc
  pasdic:
    description: Activer/désactiver le mode PASDIC sur un chunk
    usage: /pasdic set <true|false>
    permission: cantale.admin
  perm:
    description: Gérer les permissions des joueurs
    usage: /perm <set|remove|check|list>
  unbanip:
    description: Débannir une IP
    usage: /unbanip <ip>
  leaderboard:
    description: Afficher les classements
    usage: /leaderboard <type> [limite]
    aliases: [top, lb, leaderboards, classement, classements]
  lastdeath:
    description: Afficher date/coords de la dernière mort ; staff = inventaire lecture seule
    usage: /lastdeath [joueur]
    # Vue inventaire : cantale.admin toujours ; cantale.moderator + mode trace (/moderation)
  optimize:
    description: Optimisation du serveur (admin)
    usage: /optimize [stats|cleanup|clearall|save|chunks|villagers|gc|on|off|reload]
    permission: cantale.admin
  ec:
    description: Ouvrir l'Ender Chest
    usage: /ec
  pc2:
    description: 2ème coffre privé (grade VIP ou Chèvre)
    usage: /pc2
  pc3:
    description: 3ème coffre privé (grade Chèvre)
    usage: /pc3
  rank:
    description: Gérer les grades des joueurs (admin)
    usage: /rank <set|remove|info> <joueur> [OWNER|ADMIN|MODERATOR|AVENTURIER|VIP|CHEVRE|NONE]
    permission: cantale.admin
  day:
    description: Afficher le jour et l'heure Minecraft
    usage: /day
  daily:
    description: Réclame ta récompense quotidienne
    usage: /daily
    aliases: [journalier]
  bvn:
    description: Souhaite la bienvenue à un nouveau joueur
    usage: /bvn <pseudo>
  parrain:
    description: Remercie le joueur qui t'a invité (une seule fois) — il gagne +1 vie
    usage: /parrain <joueur>
    permission: cantale.parrain
  quetes:
    description: Quêtes solo et de faction
    usage: /quetes [fac]
    aliases: [quests]
  quete:
    description: Admin quêtes (reroll / give)
    usage: /quete reroll <solo|fac> <daily|weekly|seasonal> | /quete give <joueur> <daily|weekly|seasonal|rare|epic|mythic|legendary>
    permission: cantale.admin
  collections:
    description: Collections long terme
    usage: /collections
    aliases: [collection]
  saison:
    description: Infos saison / forcer une nouvelle saison (admin)
    usage: /saison [start]
  crate:
    description: Donner des caisses ou recharger crate.yml (admin)
    usage: /crate give <joueur> <vote|rare|epic|mythic|legendary> [quantité] | /crate reload
    permission: cantale.admin
  spawner:
    description: Donner un spawner Cantale (admin)
    usage: /spawner give <joueur> <mob> [tier]
    permission: cantale.admin
  listemorts:
    description: Afficher la liste des joueurs morts définitivement
    usage: /listemorts
    aliases: [list, morts, bans]
  events:
    description: Liste les événements actifs (TP cooldown 30 s, warmup 3 s)
    usage: /events
  vote:
    description: Liste des sites de vote et récompenses
    usage: /vote [claim|stats|top|help]
  web:
    description: Affiche le lien vers le site Cantale (connexion Discord OAuth)
    usage: /web
    aliases: [website, site]

  tag:
    description: Gérer les tags des joueurs
    usage: /tag <create|delete|add|remove|color|edit|list>
    permission: cantale.moderator
  discord:
    description: Envoyer un message sur Discord depuis Minecraft
    usage: /discord <message|mp <joueur> <message>|joueur> [message]
  say:
    description: "[Owner] Faire parler le bot en jeu"
    usage: /say <message>
  anticheat:
    description: Commande d'administration du système Anti-Cheat
    usage: /anticheat
    aliases: [ac]
    permission: cantale.admin
  faq:
    description: Gérer la base de connaissances du bot FAQ
    usage: /faq <reload|add|remove>
    permission: cantale.admin
  shop:
    description: Boutique Admin (Cantox) — plancher de prix et sink économique
    usage: /shop [buy|sell] <item> <quantité> | /shop reload
    aliases: [adminshop, boutique]
  recolte:
    description: Déposer des récoltes pendant un événement faction HARVEST
    usage: /recolte
    aliases: [harvest, depositrecolte]
  feed:
    description: Restaure la faim et la saturation (VIP+)
    usage: /feed
  db:
    description: Gestion de la base de données (admin)
    usage: /db reset confirm
    permission: cantale.admin

permissions:
  cantale.givevie:
    description: Permet de donner une vie
    default: op
  cantale.parrain:
    description: Permet d'utiliser /parrain (remercier son parrain)
    default: true
  cantale.feed:
    description: Permet d'utiliser /feed (sinon grade VIP+)
    default: false
  cantale.moderator:
    description: Permissions modérateur
    default: false
  cantale.admin:
    description: Permissions administrateur
    default: op
    children:
      cantale.givevie: true
      cantale.moderator: true
      cantale.feed: true
      cantale.anticheat.alerts: true
      cantale.anticheat.bypass: true
      cantale.faction.bypass: true
  cantale.faction.bypass:
    description: Permet d'utiliser /f bypass (ignore les protections de claims, session uniquement)
    default: op
  cantale.anticheat.alerts:
    description: Permet de recevoir les alertes de triche en jeu
    default: false
  cantale.anticheat.bypass:
    description: Permet de bypasser les vérifications de triche
    default: false
