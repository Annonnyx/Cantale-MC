# ============================================================
# Cantale — Quêtes (équilibrage)
# Copier dans plugins/CantalePlugin/ (saveResource ne fusionne pas).
# ============================================================

season:
  duration-days: 75

pools:
  solo:
    daily: 5
    weekly: 3
    seasonal: 2
  faction:
    daily: 12
    weekly: 6
    seasonal: 3

# Multiplicateurs vs montant journalier (≈ 35 min / 3.5 h / 132 h)
multipliers:
  weekly: 6.0
  seasonal: 220.0
  faction: 8.0
  variance-percent: 15

bonus:
  chance-percent: 8
  cantox-min: 500
  cantox-max: 2500
  life-chance-percent: 20

faction-rewards:
  power-daily: 1
  power-weekly: 7
  power-seasonal: 200
  participant-cantox: 150
  top-cantox: [800, 500, 300]
  top-keys: [EPIC, RARE, RARE]
  weekly-spawner-chance-percent: 15

