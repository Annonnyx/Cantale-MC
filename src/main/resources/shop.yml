  # → préférer l'ingot ; bloc convenience tax vs 9 craft ; caps buy serrés.
  NETHERITE_SCRAP: {category: MINERAIS, buy: 75000, sell: 500, daily-sell-cap: 8, daily-buy-cap: 8}
  NETHERITE_INGOT: {category: MINERAIS, buy: 250000, sell: 1300, daily-sell-cap: 4, daily-buy-cap: 2}
  NETHERITE_BLOCK: {category: MINERAIS, buy: 850000, sell: 8500, daily-buy-cap: 1}
  ANCIENT_DEBRIS: {category: MINERAIS, buy: 120000, sell: 900, daily-sell-cap: 16, daily-buy-cap: 4}

  # ── Nether & End ──
  BLAZE_ROD: {category: NETHER_END, buy: 260, sell: 25, daily-sell-cap: 100}
  ENDER_PEARL: {category: NETHER_END, buy: 240, sell: 30}
  ENDER_EYE: {category: NETHER_END, buy: 420, sell-enabled: false}
  CHORUS_FRUIT: {category: NETHER_END, buy: 24, sell: 1}
  # End Crystal : item guerre PvP (crystal), sink élevé + plafond buy serré
  END_CRYSTAL: {category: NETHER_END, buy: 100000, sell-enabled: false, daily-buy-cap: 8}
  # Shulker : pas d'End → 300k–500k + caps (trophée Cantox, pas farm)
  SHULKER_SHELL: {category: NETHER_END, buy: 350000, sell: 1800, daily-buy-cap: 4}
  SHULKER_BOX: {category: NETHER_END, buy: 500000, sell: 3200, daily-buy-cap: 2}
  # Élytra : sink endgame (mobilité PvP / exploration). Très cher, 1/jour, pas de revente shop.
  ELYTRA: {category: NETHER_END, buy: 2000000, sell-enabled: false, daily-buy-cap: 1}

