  COPPER_INGOT: {category: MINERAIS, buy: 28, sell: 7, daily-sell-cap: 1500}
  IRON_INGOT: {category: MINERAIS, buy: 75, sell: 18, daily-sell-cap: 800}
  GOLD_INGOT: {category: MINERAIS, buy: 115, sell: 28, daily-sell-cap: 500}
  REDSTONE: {category: MINERAIS, buy: 28, sell: 6, daily-sell-cap: 3000}
  LAPIS_LAZULI: {category: MINERAIS, buy: 45, sell: 10, daily-sell-cap: 2000}
  QUARTZ: {category: MINERAIS, buy: 36, sell: 8, daily-sell-cap: 1500}
  DIAMOND: {category: MINERAIS, buy: 1000, sell: 150, daily-sell-cap: 64}
  EMERALD: {category: MINERAIS, buy: 1500, sell: 220, daily-sell-cap: 32}
