# ═══════════════════════════════════════════════════════════════════════
#  CANTALE — Admin Shop (Cantox)
# ═══════════════════════════════════════════════════════════════════════
# Philosophie : ce shop n'est PAS un marché équitable. C'est :
#  1) un plancher de prix garanti (utile aux nouveaux/joueurs solo) ;
#  2) un SINK pour absorber le Cantox généré par le minage (Pickantaxe
#     1x1→7x7, Cantaxe one-shot) et éviter l'inflation.
# Achat (ce que le joueur PAIE) toujours largement > Vente (ce que le
# joueur REÇOIT). Volontairement peu rentable pour le joueur, sans être
# arnaque : les prix restent cohérents entre eux et progressifs selon la
# rareté. /ah (hôtel des ventes entre joueurs) reste le vrai marché.
#
# Repères économiques connus (pour calibrer) :
#  - Solde de départ  : 10 000 Cantox (config.yml: economy.start-balance)
#  - /daily (journalier) : 1000 Cantox de base + bonus de grade
#    (Aventurier +500, VIP +1500, Chèvre +2500 ; staff = base seule).
#    Totaux : 1500 / 2500 / 3500. L'ancien +100000 Chèvre a été retiré (EULA).
#    Les ressources rares gardent des PLAFONDS QUOTIDIENS (daily-sell-cap /
#    daily-buy-cap) en plus du prix. Shulker / Netherite : prix d'achat
#    massifs (centaines de milliers) + plafonds serrés.
#  - Vote : 100 à 1500 Cantox par vote selon le tirage (60/25/12/3%)
#  - Hausse 2026 : prix d'achat ×2 sur toutes les catégories SAUF MINERAIS
#    (minerais / métaux inchangés). Ventes inchangées.
#  - Rééquilibrage post-×2 : ventes farm / drops basiques plafonnées à
#    1 Cantox ; achats non-ultra baissés ~15–25% (netherite / shulker
#    inchangés).
#
# Format de chaque entrée (items: ou patterns:) :
#   buy               : prix d'achat (le joueur PAIE), 0 si non précisé
#   sell              : prix de vente (le joueur REÇOIT), 0 si non précisé
#   buy-enabled       : achat possible au shop (défaut true si buy > 0)
#   sell-enabled      : vente possible au shop (défaut true si sell > 0)
#   daily-sell-cap    : quantité max vendable par joueur et par jour (0 = illimité)
#   daily-buy-cap     : quantité max achetable par joueur et par jour (0 = illimité)
#
# `patterns` : règles par sous-chaîne du nom de Material (ex: tous les
# troncs `_LOG`), pour éviter d'énumérer chaque variante (bois, laines,
# béton, terracotta, lits). Un `items:` exact prime toujours sur un pattern.
# Tout Material absent des deux (et non couvert par un pattern) n'est PAS
# négociable au shop — c'est la liste noire "par omission". Une liste noire
# dure (bedrock, command blocks, spawners, livres, etc.) est en plus
# imposée directement dans le code (ShopConfig), impossible à contourner
# via ce fichier.
# ═══════════════════════════════════════════════════════════════════════

categories:
  - id: BLOCS
    display-name: "&7Blocs & Matériaux"
    icon: COBBLESTONE
  - id: BOIS
    display-name: "&6Bois & Déco"
    icon: OAK_LOG
  - id: MINERAIS
    display-name: "&bMinerais & Métaux"
    icon: DIAMOND
  - id: NETHER_END
    display-name: "&5Nether & End"
    icon: BLAZE_ROD
  - id: AGRICULTURE
    display-name: "&aAgriculture & Nourriture"
    icon: WHEAT
  - id: MOB_DROPS
    display-name: "&eDrops de Mobs"
    icon: BONE
  - id: REDSTONE
    display-name: "&cRedstone & Mécanismes"
    icon: REDSTONE
  - id: GUERRE
    display-name: "&4Guerre & PvP"
    icon: TNT

patterns:
  # Bûches / bois brut — Cantaxe = un arbre entier en un coup, prix bas + plafond serré
  - match: ["_LOG", "_WOOD", "_STEM", "_HYPHAE"]
    category: BOIS
    buy: 10
    sell: 1
    daily-sell-cap: 6000
  - match: ["_PLANKS"]
    category: BOIS
    buy: 5
    sell-enabled: false
  - match: ["_WOOL"]
    category: BOIS
    buy: 16
    sell: 1
    daily-sell-cap: 2000
  - match: ["_CONCRETE_POWDER", "_CONCRETE", "_TERRACOTTA"]
    category: BOIS
    buy: 20
    sell-enabled: false

items:
  # SAND et GUNPOWDER : volontairement absents (et blacklist code) — TNT farm via shop.
  # ── Blocs de base : infinis, jamais rachetés (générateur AFK = argent infini sinon) ──
  DIRT: {category: BLOCS, buy: 2, sell-enabled: false}
  RED_SAND: {category: BLOCS, buy: 2, sell-enabled: false}
  GRAVEL: {category: BLOCS, buy: 2, sell-enabled: false}
  COBBLESTONE: {category: BLOCS, buy: 2, sell-enabled: false}
  STONE: {category: BLOCS, buy: 2, sell-enabled: false}
  NETHERRACK: {category: BLOCS, buy: 2, sell-enabled: false}
  SANDSTONE: {category: BLOCS, buy: 3, sell-enabled: false}
  GLASS: {category: BLOCS, buy: 10, sell-enabled: false}

  # ── Minerais & métaux (buy V1 + légère baisse ~15–20% ; netherite ultra inchangé) ──
