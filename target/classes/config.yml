# ─── Base de données ─────────────────────────────────────────
# MySQL partagée entre le plugin Minecraft et le backend Node.js
database:
  type: mysql
  # Paramètres SQLite (ignorés si type = mysql)
  sqlite:
    file: cantale.db
  # Paramètres MySQL (fournis par PixelHorizons)
  mysql:
    host: 82.66.173.236
    port: 3306
    database: s115_Cantale
    username: u115_Omsepgncez
    password: "BVN==1sMd@g2YM^0c600J4Ki"
    pool-size: 10

# ─── Système de vies ───────────────────────────────────────
lives:
  # Nombre de vies au départ pour un nouveau joueur
  default-lives: 3
  # Nombre de vies minimum
  min-lives: 0
  # Prix d'une vie en Cantox (0 = gratuit via /givevie)
  buy-price: 10000
  # Ban IP quand un joueur atteint 0 vie
  ban-on-zero: true
  # Message affiché au ban
  ban-message: "&cVous n'avez plus de vies ! Achetez-en une ou attendez qu'un ami vous en donne une."
  # Saturation (effet PotionEffectType.SATURATION, amplifier 0) après respawn.
  # Amp 0 = régén faim utile sans être abusif ; durée rafraîchie à chaque respawn.
  # Recommandé 120–180 s ; défaut 150 (~2,5 min).
  respawn-saturation-seconds: 150

# Durée du tag combat (secondes). Joueur tagué : pas de TP commandes,
# pas d'entrée no-PvP (PASDIC / son claim), déco = −1 vie.
# Si le fichier live a déjà une autre valeur, elle gagne (pas de merge forcé).
combat-tag-seconds: 20

# ─── Économie ────────────────────────────────────────────────
economy:
  # Argent de départ
  start-balance: 10000

# ─── Téléportation ───────────────────────────────────────────
# Warmup 3 s, cooldown global 30 s et RTP 5 min sont appliqués en dur
# (TeleportDelayManager). Ces clés documentent le comportement ; une ancienne
# valeur delay: 5 dans un config.yml live n'est PAS relue pour le warmup.
teleport:
  # Warmup immobile avant TP (secondes). Exempt : cantale.admin + mode trace /moderation.
  delay: 3
  # Cooldown global entre deux téléportations (secondes)
  global-cooldown: 30
  # Cooldown RTP (secondes), en plus du global — le joueur attend le max des deux
  rtp-cooldown: 300
  # Norme de homes personnels : joueurs sans grade (NONE) et modos.
  # Au-dessus de la norme : Aventurier 8, VIP 10, Chèvre ∞, Admin/Owner ∞ (PlayerRank).
  max-homes: 5

# ─── Anti-AFK ────────────────────────────────────────────────
# Temps d'inactivité (secondes) avant kick. 0 = pas de limite pour ce grade.
# Clés = PlayerRank.name() en minuscules (NONE, AVENTURIER, VIP, CHEVRE, MODERATOR).
# ADMIN, OWNER, et permission Bukkit cantale.admin : jamais kick (pas de clé).
# Les modos (grade MODERATOR / cantale.moderator seul) ont une limite.
# Activité qui reset : déplacement, regard, chat, commande, interaction.
# IMPORTANT : saveDefaultConfig() ne fusionne pas. Copier ce bloc dans
# plugins/CantalePlugin/config.yml si le fichier live existe déjà.
afk:
  timeout-seconds:
    none: 600          # 10 min — joueur sans grade
    aventurier: 900    # 15 min
    vip: 1800          # 30 min
    chevre: 3600       # 60 min
    moderator: 3600    # 60 min — modos (pas admin)


# ─── Factions ────────────────────────────────────────────────
factions:
  # Nombre minimum de joueurs pour créer une faction
  min-members-create: 8
  # Chunks de départ
  start-chunks: 60
  # Homes de départ par faction
  start-homes: 30

  # Achat de pouvoir via /f bank power (officiers + chef)
  # cost(i) = floor(base * growth^(i * 10)) où i = power_purchased (unités, pas le pouvoir)
  # Chaque unité achetée → +power-per-unit pouvoir ; power_purchased += unités (échelle de prix)
  power-buy:
    base: 5000
    growth: 1.18
    max-per-purchase: 50
    power-per-unit: 10

  # Limite de hoppers posables (anti-lag). Craft désactivé ; achat /shop cher + cap quotidien.
  # max = max(min, pouvoir / divisor) — division entière. Pose uniquement dans les claims de SA fac.
  # Ex. pouvoir 65 → 3 hoppers ; 200 → 10 ; 500 → 25. Place-only (les déjà posés restent).
  hopper-limit:
    enabled: true
    divisor: 20
    min: 0

  # ── PASDIC (claim renforcé) ──
  pasdic:
    # Coût pour convertir un claim normal en PASDIC (banque de faction)
    cost: 50000
    # Blocs interdits en pose dans un PASDIC (conteneurs de stockage).
    # Fours, hauts fourneaux, fumoirs, hoppers, dropper et dispenser restent autorisés.
    banned-container-blocks:
      - CHEST
      - TRAPPED_CHEST
      - BARREL
      - ENDER_CHEST
      - WHITE_SHULKER_BOX
      - ORANGE_SHULKER_BOX
      - MAGENTA_SHULKER_BOX
      - LIGHT_BLUE_SHULKER_BOX
      - YELLOW_SHULKER_BOX
      - LIME_SHULKER_BOX
      - PINK_SHULKER_BOX
      - GRAY_SHULKER_BOX
      - LIGHT_GRAY_SHULKER_BOX
      - CYAN_SHULKER_BOX
      - PURPLE_SHULKER_BOX
      - BLUE_SHULKER_BOX
      - BROWN_SHULKER_BOX
      - GREEN_SHULKER_BOX
      - RED_SHULKER_BOX
      - BLACK_SHULKER_BOX
    # Dans un PASDIC, seuls ces types de spawn sont autorisés. Les spawners Cantale
    # spawnent via spawnEntity → CUSTOM (le spawn vanilla du bloc est neutralisé) ;
    # SPAWNER couvre d'éventuels spawners vanilla non gérés.
    # Liste vide ([]) = limitation désactivée (tout passe). Clé absente = défauts Java.
    # Autres valeurs possibles : BREEDING, DISPENSE_EGG, SPAWNER_EGG, BUILD_IRONGOLEM...
    # Liste complète : https://jd.papermc.io/paper/1.21/org/bukkit/event/entity/CreatureSpawnEvent.SpawnReason.html
    allowed-spawn-reasons: [SPAWNER, CUSTOM]

  # ── Mode secret ──
  secret:
    # Coût par intervalle de facturation (Cantox). Ancien : 1 secret/jour pendant 1h.
    # Nouveau : taxe récurrente tant que le mode secret est actif.
    daily-cost: 1000
    # Intervalle entre deux prélèvements (minutes). 20 min = 1 jour Minecraft environ.
    charge-interval-minutes: 20
    # Jours de secret gratuit pour une nouvelle faction
    free-days-new-faction: 3
    # Jours de secret gratuit après un raid subi
    free-days-after-raid: 3
    # Avertissement si la banque ne couvre pas le prochain prélèvement (minutes avant)
    warning-minutes-before: 60

  # ── Raids ──
  raid:
    # Durée du raid selon le pouvoir de la faction défenseur
    duration-minutes-small: 15
    duration-minutes-large: 60
    power-small: 100
    power-large: 500
    # Cooldown de l'attaquant après avoir mené un raid (minutes).
    # Une petite faction doit attendre plus longtemps avant de relancer un raid ;
    # une grosse faction peut spammer un peu plus.
    cooldown-minutes-small: 1440
    cooldown-minutes-large: 30
    # Nombre de raids simultanés autorisés sur la défenseur
    max-concurrent-small: 1
    max-concurrent-large: 3
    # Protection progressive après un raid (heures)
    protection-hours-small: 72
    protection-hours-large: 2

  # ── Guerre (déclaration mutuelle) ──
  # Une guerre ne démarre que si les DEUX factions font /f war <faction> l'une envers
  # l'autre : la 1re déclaration est « en attente » et expire sans réponse.
  # La paix (/f peace) est également mutuelle ; /f surrender est unilatéral (réparations).
  # Les raids (/f raid) NE nécessitent PAS la guerre.
  #
  # ┌────────────────────────────┬───────────────────────────────┬──────────────────────────────┐
  # │ Situation                  │ Hors guerre                   │ En guerre (2 belligérants)   │
  # ├────────────────────────────┼───────────────────────────────┼──────────────────────────────┤
  # │ /f raid sur claim ennemi   │ autorisé                      │ autorisé                     │
  # │ Casse/pose/TNT claims enn. │ raid actif uniquement         │ en permanence (sans /raid)   │
  # │ Mort d'un membre           │ -5 power (PvP uniquement)     │ -5 × death-power-multiplier  │
  # │ Kill sur l'ennemi          │ +5 power                      │ +5 × kill-power-multiplier   │
  # │ PASDIC                     │ toujours protégé              │ toujours protégé             │
  # └────────────────────────────┴───────────────────────────────┴──────────────────────────────┘
  war:
    # Minutes avant expiration d'une déclaration de guerre (ou d'une proposition de paix)
    # sans réponse de l'autre faction
    declaration-expiry-minutes: 15
    # Perte de pouvoir à la mort d'un membre d'une faction en guerre : 5 × ce multiplicateur
    death-power-multiplier: 2.0
    # Gain de pouvoir pour un kill sur un membre de la faction ennemie : 5 × ce multiplicateur
    kill-power-multiplier: 2.0
    # false (défaut) : TOUTE mort d'un membre en guerre applique le multiplicateur de perte
    # (PvP ou non) ; true : uniquement les morts PvP contre le belligérant
    death-multiplier-pvp-only: false
    # Réparations payées par la faction qui capitule (/f surrender) : transfert Cantox de
    # banque à banque. Si la banque du perdant est insuffisante, le reste est transféré et
    # l'annonce le signale. 0 = réparations désactivées.
    surrender-reparations-cantox: 10000

# ── Protection des claims ──
  claim-protection:
    # Blocs que les étrangers ne peuvent PAS casser dans un claim (sauf par explosion).
    # Tous les autres blocs sont cassables normalement par un étranger.
    storage-blocks:
      - CHEST
      - TRAPPED_CHEST
      - BARREL
      - FURNACE
      - BLAST_FURNACE
      - SMOKER
      - HOPPER
      - DISPENSER
      - DROPPER
      - ENDER_CHEST
      - SHULKER_BOX
      - WHITE_SHULKER_BOX
      - ORANGE_SHULKER_BOX
      - MAGENTA_SHULKER_BOX
      - LIGHT_BLUE_SHULKER_BOX
      - YELLOW_SHULKER_BOX
      - LIME_SHULKER_BOX
      - PINK_SHULKER_BOX
      - GRAY_SHULKER_BOX
      - LIGHT_GRAY_SHULKER_BOX
      - CYAN_SHULKER_BOX
      - PURPLE_SHULKER_BOX
      - BLUE_SHULKER_BOX
      - BROWN_SHULKER_BOX
      - GREEN_SHULKER_BOX
      - RED_SHULKER_BOX
      - BLACK_SHULKER_BOX
      - CRAFTING_TABLE
      - CARTOGRAPHY_TABLE
      - SMITHING_TABLE
      - LOOM
      - STONECUTTER
      - GRINDSTONE
      - FLETCHING_TABLE
      - BREWING_STAND
      - ANVIL
      - CHIPPED_ANVIL
      - DAMAGED_ANVIL

    # Blocs que les étrangers peuvent poser dans un claim (raid / grief).
    # Tout autre bloc est refusé. PASDIC : aucune pose.
    # Java ajoute aussi lodestone, seaux, wither (saveDefaultConfig ne fusionne pas).
    # Pas de lits : le wither est le seul moyen de casser l'obsidienne. Les lits
    # encore listés dans un config.yml live sont ignorés (ConfigManager les retire).
    explosive-place-blocks:
      - TNT
      - TNT_MINECART
      - OBSIDIAN
      - END_CRYSTAL
      - RESPAWN_ANCHOR
      - GLOWSTONE
      - LODESTONE
      - LAVA_BUCKET
      - SOUL_SAND
      - SOUL_SOIL
      - WITHER_SKELETON_SKULL
      - WATER_BUCKET

# ─── Messages ──────────────────────────────────────────────────
messages:
  prefix: "&8[&6Cantale&8] &r"

# ─── Clear-lag (items au sol) ──────────────────────────────────
clearlag:
  # Intervalle entre deux clears (secondes). Warnings à T-30/10/5/3/2/1.
  interval: 180
  # Ne jamais supprimer les items plus jeunes que ce délai (secondes).
  # Protège le loot de mort : un joueur a plusieurs minutes pour revenir.
  protect-recent-seconds: 300

# ─── Optimisation serveur ──────────────────────────────────────
optimization:
  # Activation globale du module (persisté par /optimize on|off)
  enabled: true
  # Intervalle d'auto-save en minutes
  autosave-interval: 5
  # Intervalle de nettoyage des entités en secondes
  entity-cleanup-interval: 60
  # Maximum d'items au sol par chunk (les items récents / loot de mort sont exclus du cull)
  max-items-per-chunk: 20
  # Maximum d'entités par chunk (hostiles, armor stands, bateaux, etc.).
  # Animals (passifs) exclus : empilés via mob-stacking. Exclus du compte / protégés :
  # joueurs, villageois, items, Animals, entités nommées (hors stacks Cantale),
  # Tameable apprivoisés, NPCs Cantale. Surplus = plus vieux d'abord.
  # Appliqué par l'optimizer (~60s) et aussi à chaque cycle ClearLag.
  max-entities-per-chunk: 15
  # Empilement des animaux passifs de ferme (remplace le cull pour les Animals)
  mob-stacking:
    enabled: true
    # Taille max d'un stack (une seule entité simulée)
    max-stack: 64
    # Rayon (blocs) pour merger le même type / même variante
    radius: 8.0
    # Intervalle de la passe de merge (secondes)
    interval-seconds: 10
    # Ne pas empiler les bébés (recommandé : évite les bugs d'âge / growth)
    stack-babies: false
    # Ne pas empiler les mobs nommés par un joueur (hors libellé ×N du stack)
    stack-named: false
    # Ne pas empiler les Tameable déjà apprivoisés
    stack-tamed: false
  # Fusion des items au sol (réduit les entités entre deux passages de ClearLag)
  item-merge:
    enabled: true
    # Rayon de fusion (blocs) autour d'un item fraîchement droppé
    radius: 4.5
    # Balayage périodique des chunks chargés (secondes)
    interval-seconds: 15
    # Le balayage ne touche qu'un chunk dépassant ce seuil d'items au sol
    min-items-per-chunk: 6
    # Taille max d'un stack fusionné (le pickup remplit plusieurs stacks d'inventaire)
    max-stack: 512
  # Ne jamais clear/cull un item plus jeune que ce délai (secondes) — loot de mort
  protect-recent-item-seconds: 300
  # Cull items par chunk (max-items-per-chunk) hors grâce ; le clear périodique = ClearLag
  clear-ground-items: true
  # Supprimer les flèches vieilles de 30s
  clear-arrows: true
  # Supprimer l'expérience au sol
  clear-experience: false
  # Désactiver entièrement les villageois (CreatureSpawnEvent + EntityTransform)
  villagers-disabled: false
  # Préchargement async de chunks : rayon autour des téléportations…
  chunk-preload-radius: 2
  # …et rayon de préchauffage du spawn au boot (0 = désactivé)
  spawn-prewarm-radius: 6
  # Gouverneur de performance adaptatif (TPS/MSPT → distances, spawners, cleanup)
  governor:
    enabled: true
    # Fréquence d'échantillonnage (secondes)
    check-interval-seconds: 5
    # Anti-flapping : temps minimum dans un mode avant tout changement…
    min-mode-seconds: 30
    # …et durée saine continue exigée avant de remonter d'un cran
    recovery-seconds: 60
    degraded:
      tps-below: 18.0
      mspt-above: 40.0
    critical:
      tps-below: 15.0
      mspt-above: 47.5
    sim-distance:
      # simulation-distance = base (boot) − drop, jamais sous min
      degraded-drop: 2
      critical-drop: 3
      min: 3
    view-distance:
      # Laisser false par défaut : la view-distance ne bouge qu'en CRITICAL si activé
      enabled: false
      critical-drop: 1
      min: 6
    spawner-slowdown:
      # Multiplicateur de l'intervalle de spawn des spawners Cantale
      degraded: 1.5
      critical: 2.0
    # Cadence du mob-stacking en mode DEGRADED+ (secondes, min 5)
    stack-interval-degraded-seconds: 5
    # Alerte staff MC + embed Discord (salon mod-logs) à l'entrée en CRITICAL (max 1/5 min)
    notify-on-critical: true

