# ─── Resource Pack ─────────────────────────────────────────────
# URL publique du pack Cantale (zip). Les joueurs le reçoivent à la connexion.
# Généré avec : cd Cantale-ResourcePack-full && zip -r ../cantale-resourcepack.zip .
# SHA-1 : shasum -a 1 cantale-resourcepack.zip
# IMPORTANT : le pack est envoyé UNIQUEMENT via server.properties.
# Laisser url/sha1 vides ici + send-on-join: false (sinon double envoi → kick).
# URL à mettre dans server.properties (lien direct, sans redirect Release) :
#   https://raw.githubusercontent.com/Annonnyx/Cantale-resourcepack/585bbda/cantale-resourcepack.zip
#   (ou .../main/... une fois le CDN à jour)
#   sha1 = ebeb3b899e72e0dcdd37bf959cce6d41e25964c6
resource-pack:
  send-on-join: false
  url: ""
  sha1: ""

# ─── Carte du monde interactive (/carte) + minimap ────────────
# MODULE DORMANT (août 2026) : la visualisation carte est assurée par le mod
# client Cantale (bridge cantale:map ci-dessous, toujours actif). La map in-game
# (tuiles FILLED_MAP, /carte, minimap item) est conservée dans le code mais
# désactivée : la commande /carte n'existe plus dans plugin.yml et le service
# MapUI n'est pas démarré. Remettre enabled: true pour la réactiver un jour.
map:
  # Carte GUI + minimap (aucune entité : tuiles FILLED_MAP en inventaire)
  enabled: false
  # /carte mini : carte live tenue en main (terrain + claims + position)
  minimap-enabled: true
  # Zoom à l'ouverture (blocs par pixel : 1, 2, 4, 8 ou 16)
  default-zoom: 4
  # Le terrain est re-rendu si son cache est plus vieux que X jours
  terrain-cache-days: 7
  # Mod client Cantale (vraie carte façon JourneyMap, touche M / minimap N)
  client-mod:
    # Canal plugin cantale:map — les joueurs SANS le mod ne reçoivent rien.
    # false = le serveur ignore les handshakes du mod (carte client = terrain seul)
    enabled: true

# ─── Système de Vote (Votifier) ────────────────────────────────
vote:
  # Diffuser un message au serveur quand un joueur vote
  broadcast: true

  # Sites de vote affichés via /vote
  # Format : "Nom Affiché|URL|cooldown" ou "Nom|URL|cooldown|alias1,alias2"
  # cooldown (heures) → nombre de Cadeaux du Roi : 24h→3 | 3h→2 | 1h→1
  # Les alias couvrent les serviceName Votifier/NuVotifier courants.
  sites:
    - "Top-Serveurs.net|https://top-serveurs.net/minecraft/vote/cantale|3|top-serveurs,TopServeurs,topserveurs"
    - "Serveur-Prive.net|https://serveur-prive.net/minecraft/cantale/vote|1|serveur-prive,ServeurPrive,serveurprive"
    - "ServeurListe.com|https://www.serveurliste.com/fr/minecraft/cantale/vote|1|serveurliste,ServeurListe"

  # Tokens de vérification fournis par les sites de vote (optionnels).
  # Serveur-Prive : token dashboard (onglet Paramètres) — polling API.
  # ServeurListe : token_api du dashboard (FAQ GET /api/vote) — polling IP.
  # Ce n'est PAS la clé publique / token NuVotifier.
  tokens:
    serveurliste.com: "a2466aea-e3a1-4837-8146-eca287ff9422"
    serveur-prive.net: "TMOJRJMZ"

  # API Serveur-Prive.net (site 2) — récompenses via polling, pas via Votifier.
  # Docs : https://developers.serveur-prive.net/getting-started#/operations/serverVotesList
  #        https://serveur-prive.net/documentation
  # Auth : le token va DANS le chemin (GET {api-url}/v1/servers/{token}/votes), pas en header Bearer.
  # Pas de webhook / claim documenté (l'endpoint votes n'accepte que GET).
  # Aucun server-id séparé : le token dashboard identifie déjà le serveur.
  serveur-prive:
    enabled: true
    api-url: "https://serveur-prive.net/api"
    # Override optionnel. Vide = vote.tokens.serveur-prive.net
    api-token: ""
    poll-interval-seconds: 60
    # Optionnel. GET /votes/{ip} n'est pas dans l'OpenAPI (serverVotesList) et 404 en live :
    # au premier 404 Cantale désactive ce chemin pour la session et s'en tient à la liste.
    check-online-ips: false
    # Ignore les votes plus vieux (évite de rejouer l'historique au 1er poll)
    max-age-minutes: 120

  # API ServeurListe.com (site 3) — FAQ https://www.serveurliste.com/fr/faq
  # GET {api-url}?ip_address={ip}&api_token={token_api}
  # Pas d'endpoint liste de votes (GET /api/votes → 404). Polling des IPs publiques en ligne.
  # token_api dashboard = vote.tokens.serveurliste.com (PAS le token / clé NuVotifier).
  # Votifier « connexion impossible » n'empêche pas les récompenses si ce polling tourne.
  serveur-liste:
    enabled: true
    api-url: "https://www.serveurliste.com/api/vote"
    # Override optionnel. Vide = vote.tokens.serveurliste.com
    api-token: ""
    poll-interval-seconds: 60
    # Ignore les votes plus vieux que l'intervalle site (FAQ : 1 h 30)
    max-age-minutes: 120

  # Pas de cooldown IP côté plugin : chaque site rate-limite déjà les votes.
  # (Ancienne clé vote.ip-cooldown-hours supprimée — elle bloquait les foyers à IP partagée.)

  # Vote Party : récompense globale quand le serveur atteint X votes dans la journée
  vote-party:
    enabled: true
    # Nombre de votes dans la journée pour déclencher la Vote Party
    goal: 50
    # Récompense globale (commande exécutée par le serveur, %player% = un joueur en ligne aléatoire)
    reward-command: "give %player% cantale:crate_vote 1"
    # Message diffusé
    message: "&6&lVOTE PARTY ! &eLe serveur a atteint %goal% votes aujourd'hui ! Un Cadeau du Roi a été offert à %player% !"

  # Rappels de vote automatiques (en minutes)
  reminders:
    enabled: true
    interval-minutes: 30
    message: "&8[&6Vote&8] &7N'oublie pas de voter pour Cantale et gagner des récompenses ! &e/vote"

  # Paliers individuels (milestones) : bonus à vie quand un joueur atteint X votes
  milestones:
    enabled: true
    # tier: nombre total de votes → message + commande récompense
    tiers:
      10:
        message: "&6%player% &ea atteint &610 votes &e! Bravo !"
        reward-command: "give %player% cantale:crate_vote 2"
      50:
        message: "&6%player% &ea atteint &650 votes &e! Incroyable !"
        reward-command: "give %player% cantale:crate_rare 1"
      100:
        message: "&6%player% &ea atteint &6100 votes &e! Légendaire !"
        reward-command: "give %player% cantale:crate_epic 1"

  # Classement mensuel : réinitialisé automatiquement le 1er de chaque mois
  monthly-leaderboard:
    enabled: true
    # Nombre de gagnants récompensés
    top-reward-count: 3
    rewards:
      1:
        message: "&6&l%player% &6remporte le classement mensuel des votes !"
        reward-command: "give %player% cantale:crate_legendary 1"
      2:
        message: "&e%player% &7termine 2ème du classement mensuel des votes !"
        reward-command: "give %player% cantale:crate_mythic 1"
      3:
        message: "&e%player% &7termine 3ème du classement mensuel des votes !"
        reward-command: "give %player% cantale:crate_epic 1"


# ─── Anti-Cheat ─────────────────────────────────────────────────
anticheat:
  # Activer/désactiver l'anti-cheat globalement
  enabled: true
  
  # Permission pour bypass l'anti-cheat
  bypass-permission: "cantale.anticheat.bypass"
  
  # Permission pour recevoir les alertes
  alerts-permission: "cantale.anticheat.alerts"
  
  # ── Score de confiance ──
  trust:
    # Score de départ
    default: 100
    # Points récupérés par minute sans violation
    recovery-per-minute: 1
    # Seuil d'avertissement (si auto-punish)
    warn-threshold: 50
    # Seuil de kick (si auto-punish)
    kick-threshold: 25
    # Durée du tempban en minutes (uniquement si punishments.ban-auto: true + récidive)
    ban-duration-minutes: 30
    # Activer warn/kick automatiques (trust 0 = alerte staff prioritaire + kick)
    auto-punish: true

  # ── Sanctions progressives (anti faux-bans) ──
  punishments:
    # Cooldown entre deux kicks automatiques du même joueur (minutes)
    kick-cooldown-minutes: 5
    # Perte de trust max par minute glissante (0 = illimité) — anti-cascade
    max-trust-loss-per-minute: 10
    # Tempban automatique sur récidive (kicks-for-tempban kicks en 24h à trust 0).
    # false = les bans restent manuels (recommandé pendant le rodage)
    ban-auto: false
    # Nombre de kicks en 24h avant tempban auto (si ban-auto: true)
    kicks-for-tempban: 3

  # ── Compensation lag (les checks mouvement skippent si dépassés) ──
  lag:
    # Au-delà de ce ping (ms), les mesures de mouvement sont ignorées
    max-ping-ms: 350
    # Sous ce TPS, les checks sensibles au timing sont suspendus
    min-tps: 18.5
    # Durée d'exemption après un knockback / explosion / vélocité serveur (ms)
    velocity-exempt-ms: 500

  # ── Intégration Grim AC (moteur packet-based principal) ──
  grim-integration:
    # Remonter les flags Grim dans le trust/alertes Cantale
    enabled: true
    # Pénalité trust par défaut pour un flag Grim
    default-trust-penalty: 2
    # Pénalités par nom de check Grim (insensible à la casse)
    trust-penalty-per-check:
      simulation: 3
      timer: 4
      badpackets: 3
      killaura: 5
      reach: 4
      scaffold: 3
  
  # ── Alertes ──
  alerts:
    # Cooldown entre alertes identiques (secondes)
    cooldown-seconds: 5
    # Envoyer sur Discord (salon mod-logs par défaut)
    discord-enabled: true
    # ID du salon Discord (laisser vide = salon mod-logs)
    discord-channel-id: ""
  
  # ── Checks de mouvement ──
  # Couverts par Grim (présent sur le serveur) : désactivés par défaut.
  # Ils se RÉACTIVENT automatiquement à chaud si Grim est absent (fallback).
  movement:
    speed:
      enabled: false
      # Vitesse max horizontale (blocs/tick) — vanilla sprint ≈ 0.28 ; elytra/eau/bateau/TP exclus en code
      max-speed: 0.50
      # Violations consécutives avant alerte
      buffer: 5
      # Points de trust retirés par violation
      trust-penalty: 3
    fly:
      enabled: false
      # Ticks en l'air max sans support
      max-air-ticks: 40
      trust-penalty: 5
    nofall:
      enabled: false
      # Hauteur min de chute pour vérifier (blocs) — détection par dégât de chute attendu
      min-fall-distance: 3.0
      trust-penalty: 4
    step:
      enabled: false
      # Hauteur max d'un step normal (blocs)
      max-step-height: 0.6
      trust-penalty: 3
    timer:
      enabled: false
      # Packets de mouvement (position) max par seconde — compensé TPS/ping en code
      max-packets-per-second: 25
      trust-penalty: 4
  
  # ── Checks de combat ──
  # Reach/KillAura/Aim couverts par Grim → désactivés par défaut (fallback auto si Grim absent).
  # AutoClicker natif conservé en complément (seuil haut, jitter humain toléré).
  combat:
    reach:
      enabled: false
      # Distance max œil→hitbox (blocs) — vanilla ≈ 3.0 ; ping compensé en code
      max-reach: 3.15
      trust-penalty: 4
    killaura:
      enabled: false
      # Ticks min entre changements de cible
      min-target-switch-ticks: 3
      trust-penalty: 5
    autoclicker:
      enabled: true
      # CPS combat max (fenêtre cps-window-ms). Dig herbe/fleurs/neige exclu en code.
      max-cps: 24
      # Fenêtre de mesure CPS (ms) — plus longue = moins de pics faux positifs
      cps-window-ms: 2000
      # Violations consécutives avant pénalité trust (decay VL prioritaire)
      buffer: 6
      trust-penalty: 2
    aim:
      enabled: false
      # Écart-type max « trop parfait » (plus bas = moins de faux positifs)
      min-rotation-deviation: 0.25
      trust-penalty: 3
  
  # ── Checks de rotation ──
  # Couverts par Grim → désactivé par défaut (fallback auto si Grim absent).
  rotation:
    enabled: false
    # Seuil de snap angle detection (legacy, snaps 180° gérés en code)
    snap-angle-threshold: 5.0
    trust-penalty: 2
  
  # ── Checks d'inventaire (vanilla uniquement, GUIs Cantale exclues) ──
  inventory:
    autoarmor:
      # Seuil corrigé : 4 équipements en < 500 ms (voir code) — activer après rodage
      enabled: false
      trust-penalty: 2
    cheststealer:
      # Seuil corrigé : 6 prises en < 500 ms sur contenants vanilla — activer après rodage
      enabled: false
      trust-penalty: 2
    fastuse:
      # État par joueur corrigé — activer après rodage
      enabled: false
      trust-penalty: 2

  # ── Checks monde (casse de blocs) ──
  world:
    fastbreak:
      enabled: true
      # Max de casses de blocs SOLIDES sur la fenêtre (herbe/fleurs/instant exclus)
      max-solid-breaks: 14
      # Fenêtre de mesure (ms)
      window-ms: 2000
      # Buffer VL avant pénalité trust
      buffer: 4
      trust-penalty: 2
  
  # ── Checks de packets (nécessite ProtocolLib) ──
  packets:
    enabled: false

# ─── Spawners Cantale ────────────────────────────────────────
# saveDefaultConfig() ne fusionne pas. Copier ce bloc dans
# plugins/CantalePlugin/config.yml si le fichier live existe déjà.
# Clés absentes = défauts Java (mêmes valeurs).
spawners:
  max-tier: 8
  # Courbe linéaire : mobs/cycle = palier ; intervalle = base / palier.
  # Nerf global (août 2026) : base 8 → 12 s ≈ −33 % de débit à tous les paliers.
  # T1 reste plus rapide que vanilla (~1/20 s ≈ 3/min) : 1 mob / 12 s = 5/min.
  # T8 cheat : 8 mobs / 1,5 s = 320/min (5,3/s).
  # Palier | mobs | intervalle | débit
  # 1 | 1 | 12 s    | 5/min
  # 2 | 2 | 6 s     | 20/min
  # 3 | 3 | 4 s     | 45/min
  # 4 | 4 | 3 s     | 80/min
  # 5 | 5 | 2,4 s   | 125/min
  # 6 | 6 | 2 s     | 180/min
  # 7 | 7 | ≈1,71 s | 245/min
  # 8 | 8 | 1,5 s   | 320/min
  # Lu à CHAQUE cycle (intervalMs) : pas de reboot nécessaire, la valeur live suffit.
  base-interval-seconds: 12
  # Golem de fer : intervalle × multiplier (défaut 2 → 50 % de cadence)
  iron-golem-interval-multiplier: 2.0
  # Rayon horizontal (blocs) — spawn clampé au chunk du spawner
  spawn-range: 4
  spawn-attempts-per-mob: 8
  crate:
    # Chance de tirer un spawner (puis un mob de la rareté, uniforme).
    # Vote : 0. Rare only rares ; Épique : 70 % epic / 30 % rare ;
    # Mythique/Légendaire : 60 % mythic / 25 % epic / 15 % rare.
    rare-chance-percent: 5.0
    epic-chance-percent: 3.0
    mythic-chance-percent: 1.5
    legendary-chance-percent: 1.5

# Rune de Fortification — tirage extra à l'ouverture (comme les spawners, sans remplacer la table).
runes:
  crate:
    # Les runes ne tombent plus des caisses Rare ; uniquement Épique, Mythique et Légendaire.
    # Vote : 0. Légendaire : ticket Discord (pas de butin) dans la table, mais rune possible en extra.
    rare-chance-percent: 0
    epic-chance-percent: 2.0
    mythic-chance-percent: 4.0
    legendary-chance-percent: 6.5


